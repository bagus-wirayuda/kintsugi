<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#075b6e" />
    <title>404 — Halaman tidak ditemukan | Kintsugi</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background: #0b132b; color: #e6ecf5;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 24px; text-align: center;
      }
      .code { font-size: clamp(64px, 18vw, 128px); font-weight: 800; line-height: 1;
        color: #f59e0b; letter-spacing: -0.04em; }
      h1 { font-size: 22px; font-weight: 700; }
      p { color: #9aa8bf; max-width: 420px; font-size: 15px; line-height: 1.6; }
      a { display: inline-block; margin-top: 8px; padding: 12px 28px; border-radius: 999px;
        background: #f59e0b; color: #0b132b; font-weight: 700; text-decoration: none;
        font-size: 14px; transition: opacity .2s; }
      a:hover { opacity: .85; }
    </style>
  </head>
  <body>
    <div class="code">404</div>
    <h1>Halaman tidak ditemukan</h1>
    <p>Halaman yang Anda cari tidak ada atau sudah dipindahkan. Kembali ke beranda untuk melanjutkan.</p>
    <a href="/">Kembali ke Beranda</a>
  </body>
</html>
