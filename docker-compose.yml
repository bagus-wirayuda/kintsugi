# Opsional untuk komputer tanpa Laragon. Database default tetap Laragon.
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: liny_jaya
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Tetapkan MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
